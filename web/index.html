<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order
    for it to work correctly.

    For more details:
    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="WhiteFox Laundry Customer Application"
  >

  <!-- iOS meta tags & icons -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="whitefox_customer_app"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <title>WhiteFox Laundry</title>

  <!-- Replace YOUR_GOOGLE_MAPS_API_KEY before building for web. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>

  <link
    rel="manifest"
    href="manifest.json"
  >
</head>

<body>

  <!-- Flutter Web -->
  <script
    src="flutter_bootstrap.js"
    async
  ></script>

</body>
</html>
