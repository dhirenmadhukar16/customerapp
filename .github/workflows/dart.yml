name: Build WhiteFox Customer Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      WHITEFOX_API_BASE_URL: ${{ secrets.WHITEFOX_API_BASE_URL }}
      WHITEFOX_WS_BASE_URL: ${{ secrets.WHITEFOX_WS_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Validate application secrets
        run: |
          test -n "$WHITEFOX_API_BASE_URL" || {
            echo "::error::WHITEFOX_API_BASE_URL is missing"
            exit 1
          }

          test -n "$WHITEFOX_WS_BASE_URL" || {
            echo "::error::WHITEFOX_WS_BASE_URL is missing"
            exit 1
          }

          test -n "$GOOGLE_MAPS_API_KEY" || {
            echo "::error::GOOGLE_MAPS_API_KEY is missing"
            exit 1
          }

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::ANDROID_STORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS is missing"
            exit 1
          }

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > android/app/whitefox-upload-key.jks

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" \
            "$KEY_PASSWORD" \
            "$KEY_ALIAS" \
            "whitefox-upload-key.jks" \
            > android/key.properties

          test -s android/app/whitefox-upload-key.jks || {
            echo "::error::Generated keystore is empty"
            exit 1
          }

          test -s android/key.properties || {
            echo "::error::Generated key.properties is empty"
            exit 1
          }

      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/whitefox-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed split APKs
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))

          flutter build apk \
            --release \
            --split-per-abi \
            --build-number="$BUILD_NUMBER" \
            --dart-define=WHITEFOX_API_BASE_URL="$WHITEFOX_API_BASE_URL" \
            --dart-define=WHITEFOX_WS_BASE_URL="$WHITEFOX_WS_BASE_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Build signed Play Store AAB
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))

          flutter build appbundle \
            --release \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=WHITEFOX_API_BASE_URL="$WHITEFOX_API_BASE_URL" \
            --dart-define=WHITEFOX_WS_BASE_URL="$WHITEFOX_WS_BASE_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Verify AAB integrity and signature
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab || {
            echo "::error::AAB was not generated"
            exit 1
          }

          unzip -t build/app/outputs/bundle/release/app-release.aab

          jarsigner -verify \
            -verbose \
            -certs \
            build/app/outputs/bundle/release/app-release.aab

          if keytool -printcert -jarfile \
            build/app/outputs/bundle/release/app-release.aab \
            | grep -qi "Android Debug"; then
            echo "::error::AAB was signed with the Android debug certificate"
            exit 1
          fi

          echo "AAB integrity and release signature verified"

      - name: Rename ARM64 APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk

      - name: Show output sizes
        run: |
          ls -lh \
            build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk

          ls -lh \
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-customer-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-customer-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-debug-symbols-${{ github.run_number }}
          path: build/debug-info/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/app/whitefox-upload-key.jks
          rm -f android/key.properties
