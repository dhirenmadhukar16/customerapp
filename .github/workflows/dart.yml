name: Build WhiteFox Customer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      WHITEFOX_API_BASE_URL: ${{ secrets.WHITEFOX_API_BASE_URL }}
      WHITEFOX_WS_BASE_URL: ${{ secrets.WHITEFOX_WS_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Validate build secrets
        run: |
          test -n "$WHITEFOX_API_BASE_URL" || {
            echo "::error::WHITEFOX_API_BASE_URL is missing"
            exit 1
          }

          test -n "$WHITEFOX_WS_BASE_URL" || {
            echo "::error::WHITEFOX_WS_BASE_URL is missing"
            exit 1
          }

          test -n "$GOOGLE_MAPS_API_KEY" || {
            echo "::error::GOOGLE_MAPS_API_KEY is missing"
            exit 1
          }

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build smaller split APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=WHITEFOX_API_BASE_URL="$WHITEFOX_API_BASE_URL" \
            --dart-define=WHITEFOX_WS_BASE_URL="$WHITEFOX_WS_BASE_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Rename ARM64 APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk

      - name: Show APK size
        run: |
          ls -lh build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-customer-arm64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/whitefox-customer-arm64-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
