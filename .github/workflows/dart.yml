name: Build WhiteFox Customer AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    env:
      # Update these for each new Play Store release.
      APP_VERSION_NAME: "1.0.2"
      APP_BUILD_NUMBER: "1029"

      WHITEFOX_API_BASE_URL: ${{ secrets.WHITEFOX_API_BASE_URL }}
      WHITEFOX_WS_BASE_URL: ${{ secrets.WHITEFOX_WS_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate build settings
        shell: bash
        run: |
          set -euo pipefail

          : "${WHITEFOX_API_BASE_URL:?Missing WHITEFOX_API_BASE_URL}"
          : "${WHITEFOX_WS_BASE_URL:?Missing WHITEFOX_WS_BASE_URL}"
          : "${GOOGLE_MAPS_API_KEY:?Missing GOOGLE_MAPS_API_KEY}"
          : "${APP_VERSION_NAME:?Missing APP_VERSION_NAME}"

          python3 - <<'PY'
          import os

          value = os.environ.get("APP_BUILD_NUMBER", "")
          if not value.isascii() or not value.isdigit():
              raise SystemExit("APP_BUILD_NUMBER must be a positive integer.")

          if not 1 <= int(value) <= 2100000000:
              raise SystemExit("APP_BUILD_NUMBER is outside the Android version-code range.")

          print(
              f"Building Whitefox "
              f"{os.environ['APP_VERSION_NAME']} "
              f"(version code {value})"
          )
          PY

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keystore = Path(
              "android/app/whitefox-upload-key.jks"
          ).resolve()
          keystore.parent.mkdir(parents=True, exist_ok=True)

          encoded = "".join(os.environ["KEYSTORE_BASE64"].split())
          keystore.write_bytes(
              base64.b64decode(encoded, validate=True)
          )

          def escape_property(value):
              encoded = value.encode("utf-16-be")
              return "".join(
                  "\\u" + encoded[i:i + 2].hex()
                  for i in range(0, len(encoded), 2)
              )

          properties = {
              "storePassword": os.environ["STORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": str(keystore),
          }

          Path("android/key.properties").write_text(
              "".join(
                  f"{key}={escape_property(value)}\n"
                  for key, value in properties.items()
              ),
              encoding="ascii",
          )
          PY

          keytool -list \
            -keystore android/app/whitefox-upload-key.jks \
            -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD >/dev/null

      - name: Build release AAB
        shell: bash
        run: |
          set -euo pipefail

          flutter build appbundle \
            --release \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=WHITEFOX_API_BASE_URL="$WHITEFOX_API_BASE_URL" \
            --dart-define=WHITEFOX_WS_BASE_URL="$WHITEFOX_WS_BASE_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Verify AAB signing certificate
        shell: bash
        run: |
          set -euo pipefail

          AAB="build/app/outputs/bundle/release/app-release.aab"
          EXPECTED="2B:5F:8B:37:F4:01:2F:C9:7F:2D:74:2D:42:66:18:E7:90:4B:A7:FE"

          test -f "$AAB" || {
            echo "::error::Release AAB was not generated."
            exit 1
          }

          CERTIFICATE="$(keytool \
            -J-Duser.language=en \
            -J-Duser.country=US \
            -printcert -jarfile "$AAB")"

          if ! printf '%s\n' "$CERTIFICATE" |
            grep -Fq "SHA1: $EXPECTED"; then
            echo "::error::AAB signing certificate does not match the expected Whitefox upload key."
            exit 1
          fi

          echo "AAB signing certificate matches the expected upload key."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-customer-${{ env.APP_VERSION_NAME }}-${{ env.APP_BUILD_NUMBER }}-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/app/whitefox-upload-key.jks
