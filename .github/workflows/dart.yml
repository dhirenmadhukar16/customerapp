
name: WhiteFox Customer APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    env:
      WHITEFOX_API_BASE_URL: ${{ secrets.WHITEFOX_API_BASE_URL }}
      WHITEFOX_WS_BASE_URL: ${{ secrets.WHITEFOX_WS_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      EXPECTED_SHA1: "2B5F8B37F4012FC97F2D742D426618E7904BA7FE"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Verify required secrets
      - name: Validate build configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${WHITEFOX_API_BASE_URL:?Missing WHITEFOX_API_BASE_URL}"
          : "${WHITEFOX_WS_BASE_URL:?Missing WHITEFOX_WS_BASE_URL}"
          : "${GOOGLE_MAPS_API_KEY:?Missing GOOGLE_MAPS_API_KEY}"

          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"

          echo "Required build configuration is present."

      # 5. Configure Android signing
      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/whitefox-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=whitefox-upload-key.jks
          EOF

          echo "Android signing configuration created."

      # 6. Verify signing certificate
      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_OUTPUT=$(
            keytool -list -v \
              -keystore android/app/whitefox-upload-key.jks \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_STORE_PASSWORD"
          )

          ACTUAL_SHA1=$(
            printf '%s\n' "$CERTIFICATE_OUTPUT" |
            grep -i "SHA1:" |
            head -n 1 |
            awk '{print $2}' |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Signing certificate SHA-1 mismatch."
            exit 1
          fi

          echo "Signing certificate verified."

      # 7. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 8. Build signed APK
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release \
            --dart-define=WHITEFOX_API_BASE_URL="$WHITEFOX_API_BASE_URL" \
            --dart-define=WHITEFOX_WS_BASE_URL="$WHITEFOX_WS_BASE_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      # 9. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK file was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      # 10. Upload APK artifact
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: whitefox-customer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Cleanup signing files
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/app/whitefox-upload-key.jks
